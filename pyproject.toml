[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ryushi"
version = "0.1.0"
description = "AI-powered RSS digest service for FreshRSS"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115,<0.137",
    "uvicorn[standard]>=0.32,<0.47",
    "httpx>=0.28,<0.29",
    "litellm>=1.55,<2.0",
    "tenacity>=8.2,<10.0",
    "feedgen>=1.0,<2.0",
    "sqlmodel>=0.0.22,<0.1",
    "apscheduler>=3.10,<4.0",
    "pydantic-settings>=2.7,<3.0",
    "pyyaml>=6.0,<7.0",
    "starlette>=1.0",
    "aiosqlite>=0.19,<1.0",
    "markdown-it-py>=3.0,<4.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.13",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pip-audit>=2.6",
]

[project.scripts]
ryushi = "ryushi.main:run"
ryushi-feeds = "ryushi.feeds.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-m 'not smoke'"
markers = [
    "smoke: manual smoke tests requiring external services and credentials",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
